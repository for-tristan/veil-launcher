name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Cancel any in-flight run when a new commit lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write       # required by tauri-action to create releases
      actions: write        # required to upload artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Compile cslol-dll.dll from the bundled cslol_stub.c source. mod-tools.exe
      # links cslol-dll.dll at load time and refuses to start without it, even
      # though the mkoverlay command (which is all we use) never calls into it.
      # The stub exports the expected function names as no-ops.
      - name: Compile cslol-dll.dll stub
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd src-tauri\resources
          cl /LD cslol_stub.c /Fe:cslol-dll.dll /link /NOLOGO
          dir cslol-dll.dll

      - name: Verify Rust build (debug)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # On tag pushes (v*): build release + create a draft GitHub release
      # with the installers attached.
      - name: Build & release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Veil launcher ${{ github.ref_name }}'
          releaseBody: |
            Download the matching installer for your machine below.

            - `Veil_*_x64-setup.exe` — recommended Windows installer (NSIS)
            - `Veil_*_x64_en-US.msi` — alternative MSI installer
          releaseDraft: true
          prerelease: false

      # On main-branch pushes or manual runs: build release but only
      # attach the installers as CI artifacts (no GitHub release).
      - name: Build release (on main / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: veil-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
