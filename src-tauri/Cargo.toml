[package]
name = "veil"
version = "0.1.0"
description = "Minimalist League of Legends skin changer launcher"
authors = ["You"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "veil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tokio is already in Tauri's dependency tree; declaring it directly here
# gives us access to `tokio::time::sleep` for the mocked async latencies
# in commands (replace with `reqwest`-driven real I/O later).
tokio = { version = "1", features = ["time"] }

# Windows-only deps used for real LoL install path detection.
# These are excluded on non-Windows targets so cross-compiles still work.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Keep the binary small — strip symbols in release.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
